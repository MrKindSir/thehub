# TheHub local Docker stack (dev) — group conference calling (WebRTC + Socket.IO).
# Uses the localhost app files under ../../apps via volume mounts.
#
# NOTE: This is the harder group-calling tutorial. TURN (Twilio) credentials in
# apps/server/server.js may be invalid/expired; LAN/localhost often works without TURN.
# Do not run at the same time as HubStream on host port 5002 — TheHub uses 5003.
#
# Start:
#   ./docker-compose-wrapper.sh up -d
#
# URLs:
#   Client: http://localhost:3011
#   API:    http://localhost:5003

name: thehub

services:
  server:
    image: node:20-bookworm
    container_name: thehub-server
    restart: "no"
    working_dir: /app
    volumes:
      - ../../apps/server:/app
    command: sh -c "npm install && node server.js"
    environment:
      PORT: "5003"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    ports:
      - "${THEHUB_API_PORT:-5003}:5003"
    networks:
      - thehub

  client:
    image: node:20-bookworm
    container_name: thehub-client
    restart: "no"
    working_dir: /app
    volumes:
      - ../../apps/thehub:/app
    command: sh -c "npm install && npm start"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WDS_SOCKET_PORT: "0"
      CHOKIDAR_USEPOLLING: "true"
      BROWSER: "none"
      REACT_APP_SERVER_URL: http://localhost:${THEHUB_API_PORT:-5003}
    ports:
      - "${THEHUB_CLIENT_PORT:-3011}:3000"
    depends_on:
      - server
    networks:
      - thehub

networks:
  thehub:
    name: thehub-network
